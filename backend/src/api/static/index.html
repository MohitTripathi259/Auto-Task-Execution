<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Agent Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2128;
      --bg-hover: #21262d;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #656d76;
      --accent: #58a6ff;
      --accent-dim: #1f3a5c;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --info: #58a6ff;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    .sidebar { background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .main { display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sidebar-header .logo { width: 28px; height: 28px; background: linear-gradient(135deg, #58a6ff, #bc8cff); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .sidebar-header h6 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
    .sidebar-header small { color: var(--text-muted); font-size: 10px; }

    /* ── New Task Button ── */
    .btn-new-task { margin: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; padding: 8px 14px; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); transition: all .15s; }
    .btn-new-task:hover { background: var(--accent); color: #fff; }

    /* ── Task List ── */
    .task-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
    .task-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; transition: all .15s; }
    .task-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .task-item.active { background: var(--accent-dim); border-color: var(--accent); }
    .task-item .task-goal { font-size: 12px; font-weight: 500; line-height: 1.4; margin-bottom: 5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-item .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-item .task-time { font-size: 10px; color: var(--text-muted); }

    /* ── Badges ── */
    .badge-status { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
    .status-pending    { background: #2d333b; color: var(--text-secondary); }
    .status-planning   { background: #2d2a1e; color: var(--warning); }
    .status-running    { background: #1a3a5c; color: var(--info); }
    .status-completed  { background: #1a3a27; color: var(--success); }
    .status-failed     { background: #3a1a1a; color: var(--danger); }
    .status-cancelled  { background: #2d333b; color: var(--text-muted); }
    .risk-low    { background: #1a3a27; color: var(--success); }
    .risk-medium { background: #2d2a1e; color: var(--warning); }
    .risk-high   { background: #3a1a1a; color: var(--danger); }

    /* ── Main Panel ── */
    .main-header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); display: flex; align-items: center; gap: 12px; min-height: 65px; }
    .main-header .task-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .main-content { flex: 1; overflow-y: auto; padding: 20px; }

    /* ── Empty State ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; padding: 40px; }
    .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: .4; }
    .empty-state p { font-size: 14px; max-width: 300px; line-height: 1.6; }

    /* ── Progress Steps ── */
    .steps-container { display: flex; flex-direction: column; gap: 8px; }
    .step-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: start; transition: border-color .2s; }
    .step-card.step-completed { border-left: 3px solid var(--success); }
    .step-card.step-running   { border-left: 3px solid var(--info); background: #0d1a2a; animation: runningPulse 2s ease-in-out infinite; }
    @keyframes runningPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(88,166,255,0); } 50% { box-shadow: 0 0 0 4px rgba(88,166,255,.15); } }
    .step-card.step-failed    { border-left: 3px solid var(--danger); }
    .step-card.step-pending   { border-left: 3px solid var(--border); opacity: .7; }
    .step-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
    .icon-completed { background: #1a3a27; color: var(--success); }
    .icon-running   { background: #1a3a5c; color: var(--info); }
    .icon-failed    { background: #3a1a1a; color: var(--danger); }
    .icon-pending   { background: #21262d; color: var(--text-muted); }
    .step-body { min-width: 0; }
    .step-index { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .step-action { font-size: 13px; line-height: 1.5; color: var(--text-primary); }
    .step-meta { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
    .step-meta .sha { font-family: 'Courier New', monospace; color: var(--accent); }
    .step-time-range { font-size: 11px; color: var(--text-muted); text-align: right; white-space: nowrap; }
    .step-error { font-size: 11px; color: var(--danger); margin-top: 5px; background: #200d0d; padding: 6px 8px; border-radius: 4px; font-family: monospace; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }

    /* ── Pulse for running ── */
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }

    /* ── Summary Card ── */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .stat-card .stat-value { font-size: 22px; font-weight: 700; }
    .stat-card .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    /* ── Tabs ── */
    .nav-tabs-custom { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .nav-tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
    .nav-tab:hover { color: var(--text-primary); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Audit Trail ── */
    .audit-list { display: flex; flex-direction: column; gap: 6px; }
    .audit-event { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; display: grid; grid-template-columns: 140px 1fr; gap: 10px; font-size: 12px; }
    .audit-time { color: var(--text-muted); font-family: monospace; }
    .audit-type { font-weight: 600; color: var(--text-primary); }
    .audit-payload { color: var(--text-secondary); font-size: 11px; margin-top: 2px; font-family: monospace; word-break: break-all; }

    /* ── Report ── */
    .report-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .report-section h6 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 10px; }
    .report-content { font-size: 13px; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap; }

    /* ── Modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 540px; padding: 24px; }
    .modal-box h5 { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
    .form-control, .form-select { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; font-size: 13px; padding: 9px 12px; width: 100%; transition: border-color .15s; }
    .form-control:focus, .form-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); background: var(--bg-secondary); color: var(--text-primary); }
    .form-control::placeholder { color: var(--text-muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit { background: var(--accent); border: none; color: #fff; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all .15s; width: 100%; margin-top: 4px; }
    .btn-submit:hover { background: #79b8ff; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); font-size: 13px; padding: 9px 16px; border-radius: 8px; cursor: pointer; }
    .btn-cancel:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
    .toast-msg { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; animation: slideIn .2s ease; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
    @keyframes slideIn { from { transform: translateX(100%); opacity:0 } to { transform: translateX(0); opacity:1 } }
    .toast-success { border-left: 3px solid var(--success); }
    .toast-error   { border-left: 3px solid var(--danger); }
    .toast-info    { border-left: 3px solid var(--accent); }

    /* ── Backtrack button ── */
    .btn-backtrack { font-size: 10px; padding: 3px 8px; border-radius: 5px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; transition: all .15s; }
    .btn-backtrack:hover { border-color: var(--warning); color: var(--warning); }

    .loading-dots::after { content: ''; animation: dots 1.2s steps(3,end) infinite; }
    @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }
  </style>
</head>
<body>

<div class="layout">
  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">⚡</div>
      <div>
        <h6>Autonomous Agent</h6>
        <small>Platform v0.1</small>
      </div>
    </div>

    <button class="btn-new-task" onclick="openModal()">
      <i class="fas fa-plus me-1"></i> New Task
    </button>

    <div style="padding: 0 12px 6px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px;">Recent Tasks</span>
      <span id="poll-indicator" style="font-size:10px; color:var(--text-muted);">●</span>
    </div>

    <div class="task-list" id="task-list">
      <div style="text-align:center; padding:24px 0; color:var(--text-muted); font-size:12px;">
        No tasks yet. Create one!
      </div>
    </div>
  </div>

  <!-- ── Main ── -->
  <div class="main">
    <div class="main-header" id="main-header">
      <div class="empty-state" style="height:auto; padding:0; flex-direction:row; gap:10px; color:var(--text-muted);">
        <i class="fas fa-robot" style="font-size:18px; opacity:.4;"></i>
        <span style="font-size:13px;">Select a task or create a new one</span>
      </div>
    </div>

    <div class="main-content" id="main-content">
      <div class="empty-state">
        <i class="fas fa-robot"></i>
        <p>Your autonomous agent is ready.<br>Submit a task and watch it execute step-by-step.</p>
        <button class="btn-new-task" onclick="openModal()" style="margin:0; margin-top:12px;">
          <i class="fas fa-plus me-1"></i> Create First Task
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h5><i class="fas fa-plus-circle" style="color:var(--accent)"></i> New Task</h5>

    <div class="mb-3">
      <label class="form-label">Goal <span style="color:var(--danger)">*</span></label>
      <textarea class="form-control" id="f-goal" rows="3"
        placeholder="e.g. Add phone number validation to the checkout form with E.164 format support and unit tests"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Repository URL <span style="color:var(--text-muted); font-weight:400; text-transform:none;">(optional — leave blank for demo workspace)</span></label>
      <input class="form-control" id="f-repo" type="text" placeholder="https://github.com/your-org/your-repo" />
    </div>

    <div class="form-row mb-3">
      <div>
        <label class="form-label">Max Cost (USD)</label>
        <input class="form-control" id="f-cost" type="number" value="5.00" min="0.5" max="50" step="0.5" />
      </div>
      <div>
        <label class="form-label">Max Runtime (min)</label>
        <input class="form-control" id="f-runtime" type="number" value="60" min="5" max="240" step="5" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Tenant ID</label>
      <input class="form-control" id="f-tenant" type="text" value="default" />
    </div>

    <div class="mb-3">
      <label class="form-label">Task Skill <span style="color:var(--text-muted); font-weight:400; text-transform:none;">(optional — paste skill.md content for domain-specific instructions)</span></label>
      <textarea class="form-control" id="f-skill" rows="4"
        placeholder="## Role&#10;You are a specialist in...&#10;&#10;## Rules&#10;- Always..."></textarea>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="submit-btn" onclick="submitTask()">
        <i class="fas fa-rocket me-1"></i> Launch Task
      </button>
    </div>
  </div>
</div>

<!-- ── Toast Container ── -->
<div class="toast-container" id="toast-container"></div>

<script>
const API = '';  // same origin
let selectedTaskId = null;
let tasks = [];
let pollTimer = null;
let detailPollTimer = null;
let activeTab = 'steps';

// ── Polling ────────────────────────────────────────────────────────────────

let _lastDetailStatus = null;

function startPolling() {
  fetchTaskList();
  pollTimer = setInterval(fetchTaskList, 3000);
  // Faster detail refresh (every 4s) when a task is active
  detailPollTimer = setInterval(refreshDetailIfActive, 4000);
}

async function fetchTaskList() {
  try {
    const r = await fetch(`${API}/v1/jobs?tenant_id=default&limit=30`);
    if (!r.ok) return;
    const data = await r.json();
    tasks = data.jobs || [];
    renderTaskList();
    const dot = document.getElementById('poll-indicator');
    dot.style.color = 'var(--success)';
    setTimeout(() => dot.style.color = 'var(--text-muted)', 400);
  } catch(e) {}
}

async function refreshDetailIfActive() {
  if (!selectedTaskId) return;
  const t = tasks.find(t => t.task_id === selectedTaskId);
  const isActive = !t || ['pending','planning','running'].includes(t?.status);
  if (isActive) {
    await fetchTaskDetail(selectedTaskId);
  } else if (t && t.status !== _lastDetailStatus) {
    // Status just changed (e.g. completed/failed) — do one final refresh
    _lastDetailStatus = t.status;
    await fetchTaskDetail(selectedTaskId);
  }
}

function renderTaskList() {
  const el = document.getElementById('task-list');
  if (!tasks.length) {
    el.innerHTML = `<div style="text-align:center;padding:24px 0;color:var(--text-muted);font-size:12px;">No tasks yet. Create one!</div>`;
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="task-item ${t.task_id === selectedTaskId ? 'active' : ''}" onclick="selectTask('${t.task_id}')">
      <div class="task-goal">${escHtml(t.goal)}</div>
      <div class="task-meta">
        <span class="badge-status status-${t.status}">${statusIcon(t.status)} ${t.status}</span>
        ${t.risk_level ? `<span class="badge-status risk-${t.risk_level}">${t.risk_level}</span>` : ''}
        <span class="task-time">${relTime(t.created_at)}</span>
      </div>
    </div>
  `).join('');
}

// ── Task Detail ────────────────────────────────────────────────────────────

async function selectTask(taskId) {
  selectedTaskId = taskId;
  renderTaskList();
  await fetchTaskDetail(taskId);
}

async function fetchTaskDetail(taskId) {
  try {
    const r = await fetch(`${API}/v1/tasks/${taskId}`);
    if (!r.ok) return;
    const task = await r.json();
    renderTaskDetail(task);
  } catch(e) {}
}

function renderTaskDetail(task) {
  // Header
  const header = document.getElementById('main-header');
  header.innerHTML = `
    <div style="flex:1; min-width:0;">
      <div class="task-title">${escHtml(task.goal)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
        <span class="badge-status status-${task.status}">${statusIcon(task.status)} ${task.status}</span>
        ${task.risk_level ? `<span class="badge-status risk-${task.risk_level}"><i class="fas fa-shield-alt"></i> ${task.risk_level} risk</span>` : ''}
        <span style="font-size:11px; color:var(--text-muted); font-family:monospace;">${task.task_id}</span>
      </div>
    </div>
    <div style="text-align:right; flex-shrink:0; display:flex; align-items:center; gap:8px;">
      ${task.pr_url ? `
        <a href="${task.pr_url}" target="_blank" style="font-size:11px; padding:4px 10px; border-radius:6px; background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); text-decoration:none;">
          <i class="fas fa-code-pull-request"></i> View PR
        </a>
      ` : ''}
      ${task.status === 'running' || task.status === 'planning' ? `
        <button onclick="cancelTask('${task.task_id}')" style="font-size:11px; padding:4px 10px; border-radius:6px; background:transparent; border:1px solid var(--danger); color:var(--danger); cursor:pointer;">
          <i class="fas fa-stop"></i> Cancel
        </button>
      ` : ''}
    </div>
  `;

  // Content
  const content = document.getElementById('main-content');
  const completedSteps = task.steps.filter(s => s.status === 'completed').length;
  const failedSteps    = task.steps.filter(s => s.status === 'failed').length;
  const totalSteps     = task.steps.length;
  const pct = totalSteps ? Math.round((completedSteps / totalSteps) * 100) : 0;

  content.innerHTML = `
    <!-- Summary -->
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-value" style="color:var(--accent)">${totalSteps}</div>
        <div class="stat-label">Total Steps</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--success)">${completedSteps}</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--danger)">${failedSteps}</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--text-primary)">${pct}%</div>
        <div class="stat-label">Progress</div>
      </div>
    </div>

    <!-- Progress bar -->
    ${totalSteps > 0 ? `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:6px;">
        <span>Execution Progress</span>
        <span>${completedSteps}/${totalSteps} steps</span>
      </div>
      <div style="height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${failedSteps ? 'var(--warning)' : 'var(--success)'};border-radius:3px;transition:width .5s;"></div>
      </div>
    </div>` : ''}

    <!-- Tabs -->
    <div class="nav-tabs-custom">
      <div class="nav-tab ${activeTab==='steps'?'active':''}" onclick="switchTab('steps')"><i class="fas fa-list-check me-1"></i>Steps</div>
      <div class="nav-tab ${activeTab==='audit'?'active':''}" onclick="switchTab('audit')"><i class="fas fa-scroll me-1"></i>Audit Trail</div>
      <div class="nav-tab ${activeTab==='report'?'active':''}" onclick="switchTab('report')"><i class="fas fa-file-alt me-1"></i>Report</div>
    </div>

    <div id="tab-content">
      ${activeTab==='steps'  ? renderSteps(task) : ''}
      ${activeTab==='audit'  ? '<div id="audit-placeholder"><div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px;">Loading audit trail<span class="loading-dots"></span></div></div>' : ''}
      ${activeTab==='report' ? '<div id="report-placeholder"><div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px;">Loading report<span class="loading-dots"></span></div></div>' : ''}
    </div>
  `;

  if (activeTab === 'audit')  loadAudit(task.task_id);
  if (activeTab === 'report') loadReport(task.task_id, task);
}

function switchTab(tab) {
  activeTab = tab;
  if (selectedTaskId) fetchTaskDetail(selectedTaskId);
}

function renderSteps(task) {
  if (!task.steps.length) {
    if (task.status === 'planning' || task.status === 'pending') {
      return `<div style="text-align:center;padding:40px;color:var(--text-muted);">
        <div class="spinner" style="width:24px;height:24px;margin:0 auto 12px;"></div>
        <p style="font-size:13px;">${task.status === 'planning' ? 'Planner is generating execution steps…' : 'Task is queued…'}</p>
      </div>`;
    }
    return `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No steps yet.</div>`;
  }

  return `<div class="steps-container">${task.steps.map((s, i) => `
    <div class="step-card step-${s.status}">
      <div class="step-icon icon-${s.status}">
        ${s.status === 'completed' ? '<i class="fas fa-check"></i>'
        : s.status === 'running'   ? '<div class="spinner"></div>'
        : s.status === 'failed'    ? '<i class="fas fa-times"></i>'
        : `<span style="font-size:11px;color:var(--text-muted)">${i+1}</span>`}
      </div>
      <div class="step-body">
        <div class="step-index">Step ${i+1}</div>
        <div class="step-action">${escHtml(s.action)}</div>
        <div class="step-meta">
          ${s.head_sha ? `<span class="sha"><i class="fas fa-code-branch" style="font-size:9px;"></i> ${s.head_sha.substring(0,8)}</span>` : ''}
          ${s.started_at ? `<span>${duration(s.started_at, s.completed_at)}</span>` : ''}
        </div>
        ${s.error ? `<div class="step-error"><i class="fas fa-exclamation-triangle me-1"></i>${escHtml(s.error)}</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        ${s.status === 'completed' ? `
          <button class="btn-backtrack" id="bt-${s.step_id}" onclick="backtrackTo('${task.task_id}','${s.step_id}','${s.action.substring(0,50).replace(/'/g,"\\'")}',this)" title="Re-run from this step">
            <i class="fas fa-rotate-left"></i> Backtrack
          </button>` : ''}
        ${s.status === 'running' ? `<span class="pulse" style="font-size:10px;color:var(--info);font-weight:600;letter-spacing:.5px;">● RUNNING</span>` : ''}
        ${s.status === 'pending' && task.status === 'running' ? `<span style="font-size:10px;color:var(--text-muted);">queued</span>` : ''}
      </div>
    </div>
  `).join('')}</div>`;
}

async function loadAudit(taskId) {
  try {
    const r = await fetch(`${API}/v1/tasks/${taskId}/audit`);
    const data = await r.json();
    const events = data.events || [];
    const el = document.getElementById('audit-placeholder');
    if (!el) return;
    if (!events.length) {
      el.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No events recorded yet.</div>`;
      return;
    }
    el.innerHTML = `<div class="audit-list">${events.map(e => {
      const payload = e.payload || {};
      const payloadStr = Object.keys(payload).length
        ? Object.entries(payload).map(([k,v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')
        : '';
      return `
        <div class="audit-event">
          <div class="audit-time">${(e.timestamp||'').substring(11,19)}</div>
          <div>
            <div class="audit-type">${escHtml(e.event_type)}</div>
            ${payloadStr ? `<div class="audit-payload">${escHtml(payloadStr.substring(0,200))}</div>` : ''}
          </div>
        </div>`;
    }).join('')}</div>`;
  } catch(e) {}
}

async function loadReport(taskId, task) {
  const el = document.getElementById('report-placeholder');
  if (!el) return;

  if (task.status !== 'completed' && task.status !== 'failed') {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Report available after task completes.</div>`;
    return;
  }

  try {
    const r = await fetch(`${API}/v1/tasks/${taskId}/report`);
    if (!r.ok) {
      el.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Report not yet generated.</div>`;
      return;
    }
    const data = await r.json();
    el.innerHTML = `
      <div class="report-section">
        <h6><i class="fas fa-link me-1"></i>Report URL</h6>
        <a href="${data.report_url}" target="_blank" style="color:var(--accent);font-size:12px;word-break:break-all;">${data.report_url}</a>
      </div>
      <div class="report-section">
        <h6><i class="fas fa-chart-bar me-1"></i>Summary</h6>
        <div class="report-content">Task completed with ${task.steps.filter(s=>s.status==='completed').length}/${task.steps.length} steps.\nRisk level: ${task.risk_level || 'N/A'}\nTask ID: ${task.task_id}</div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Could not load report.</div>`;
  }
}

// ── Actions ────────────────────────────────────────────────────────────────

async function submitTask() {
  const goal = document.getElementById('f-goal').value.trim();
  if (!goal) { toast('Please enter a goal', 'error'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px;"></span>Launching…';

  try {
    const skillContent = document.getElementById('f-skill').value.trim();
    const body = {
      goal,
      repo_url:             document.getElementById('f-repo').value.trim() || null,
      max_cost_usd:         parseFloat(document.getElementById('f-cost').value) || 5.0,
      max_runtime_minutes:  parseInt(document.getElementById('f-runtime').value) || 60,
      tenant_id:            document.getElementById('f-tenant').value.trim() || 'default',
      task_skill:           skillContent || null,
    };

    const r = await fetch(`${API}/v1/tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();

    if (!r.ok) {
      // 422 detail is an array of validation errors; extract readable message
      let errMsg = 'Failed to create task';
      if (data.detail) {
        if (Array.isArray(data.detail)) {
          errMsg = data.detail.map(e => `${e.loc?.slice(-1)[0]}: ${e.msg}`).join('; ');
        } else if (typeof data.detail === 'string') {
          errMsg = data.detail;
        }
      }
      toast(errMsg, 'error');
    } else {
      toast(`Task created: ${data.task_id}`, 'success');
      closeModal();
      await fetchTaskList();
      await selectTask(data.task_id);
    }
  } catch(e) {
    toast('Network error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-rocket me-1"></i> Launch Task';
  }
}

async function cancelTask(taskId) {
  if (!confirm('Cancel this task?')) return;
  try {
    await fetch(`${API}/v1/tasks/${taskId}/cancel`, { method: 'POST' });
    toast('Task cancelled', 'info');
    fetchTaskDetail(taskId);
  } catch(e) {}
}

async function backtrackTo(taskId, stepId, actionHint, btn) {
  const reason = prompt(`Re-run from: "${actionHint}…"\n\nReason (optional):`);
  if (reason === null) return;  // cancelled

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:10px;height:10px;border-width:2px;display:inline-block;vertical-align:middle;"></span> Starting…';
  }

  try {
    const r = await fetch(`${API}/v1/tasks/${taskId}/backtrack/${stepId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reason || 'Manual backtrack from UI' }),
    });
    const data = await r.json();
    if (!r.ok) {
      toast(data.detail || 'Backtrack failed', 'error');
    } else {
      toast(`↩ Backtracking — re-running from step ${data.target_index + 1}`, 'info');
      // Immediately refresh to show steps going back to pending
      await fetchTaskDetail(taskId);
      await fetchTaskList();
    }
  } catch(e) {
    toast('Backtrack failed: ' + e.message, 'error');
  }
}

// ── Modal ──────────────────────────────────────────────────────────────────

function openModal() {
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('f-goal').focus(), 50);
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Toast ──────────────────────────────────────────────────────────────────

function toast(msg, type='info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast-msg toast-${type}`;
  el.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}" style="color:var(--${type==='success'?'success':type==='error'?'danger':'accent'})"></i> ${escHtml(msg)}`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── Helpers ────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusIcon(s) {
  const icons = { pending:'⏳', planning:'🧠', running:'⚡', completed:'✅', failed:'❌', cancelled:'🚫' };
  return icons[s] || '●';
}

function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function duration(start, end) {
  if (!start) return '';
  const ms = (end ? new Date(end) : new Date()) - new Date(start);
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms/1000).toFixed(1)}s`;
  return `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openModal(); }
});

// ── Init ───────────────────────────────────────────────────────────────────
startPolling();
</script>
